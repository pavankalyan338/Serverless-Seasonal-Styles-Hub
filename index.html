<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasonal Styles Hub - Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="logo">Seasonal Styles ☁️</div>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">🛒 Cart</a>
        <span id="userGreeting" style="margin-left:15px; font-weight:bold;"></span>
        <a href="login.html" id="loginNavBtn" style="background: rgba(255,255,255,0.2)">Sign In</a>
      </nav>
    </div>
    <div class="filter-container">
      <select id="seasonSelect" class="custom-dropdown" onchange="fetchProducts(this.value)">
        <option value="All">All Seasons Collection</option>
        <option value="spring">🌸 Spring Wear</option>
        <option value="summer">☀️ Summer Outfits</option>
        <option value="autumn">🍁 Autumn Fashion</option>
        <option value="winter">❄️ Winter Special</option>
      </select>
    </div>
  </header>
  <main><div id="productGrid" class="product-grid"></div></main>
  <script src="script.js"></script>
</body>
</html>
